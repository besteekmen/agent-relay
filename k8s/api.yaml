apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-relay-api
  template:
    metadata:
      labels:
        app: agent-relay-api
    spec:
      # The app connects to its database at import time. Wait for PostgreSQL
      # before launching Uvicorn, as Compose's healthy dependency does.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-bookworm
          envFrom:
            - secretRef:
                name: agent-relay-database
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
      containers:
        - name: api
          image: agent-relay:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-relay-database
                  key: RELAY_DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay-api
spec:
  type: ClusterIP
  selector:
    app: agent-relay-api
  ports:
    - name: http
      port: 8000
      targetPort: http
