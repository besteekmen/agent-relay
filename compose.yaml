services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay-local@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay-local
      POSTGRES_DB: agent_relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
